<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Library</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;    font-family: monospace;
 }

  :root {
    --bg: #0e0e10;
    --bg2: #161618;
    --bg3: #1e1e22;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text-primary: #f0f0f2;
    --text-secondary: #9898a8;
    --text-muted: #55556a;
    --accent: #7f77dd;
    --accent-dim: rgba(127,119,221,0.12);
    --accent-hover: rgba(127,119,221,0.22);
    --green: #1d9e75;
    --green-dim: rgba(29,158,117,0.13);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
  }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 18px 36px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .logo-box {
    width: 30px;
    height: 30px;
    background: var(--accent);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 15px;
    border: 3px solid whitesmoke;
  }

  .logo h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: var(--text-primary);
  }

  .badge {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .search-wrap {
    flex: 1;
    max-width: 340px;
    margin-left: auto;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13.5px;
    padding: 8px 12px 8px 33px;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    transition: border-color 0.15s, background 0.15s;
  }

  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg3);
  }

  .card-header {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .card-num {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .card-desc {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.65;
    font-family: 'SF Mono', 'Fira Code', monospace;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chars {
    font-size: 11px;
    color: var(--text-muted);
  }

  .btn-copy {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    border: 1px solid rgba(127,119,221,0.22);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 13px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn-copy:hover { background: var(--accent-hover); }
  .btn-copy:active { transform: scale(0.97); }
  .btn-copy.copied {
    background: var(--green-dim);
    border-color: rgba(29,158,117,0.28);
    color: var(--green);
  }

  .btn-copy svg { width: 13px; height: 13px; flex-shrink: 0; }

  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 64px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .search-wrap { max-width: 100%; margin-left: 0; order: 4; width: 100%; }
    main { padding: 18px 12px 40px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-box">P</div>
    <h1>Prompt Library</h1>
  </div>
  <span class="badge" id="badge">0 prompts</span>
  <div class="search-wrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
    </svg>
    <input type="text" id="search" placeholder="Search by title, description, or content…" autocomplete="off">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
const PROMPTS = [
  {
    id: 1,
    title: "The Deep Backend Context Architect",
    description: "Part 1: The Master Context Architect Prompts - Prompt 1",
    prompt:"You are a Principal Backend Solutions Architect and Cyber-Security Engineer. Your objective is to generate an ultra-deep, production-grade, hyper-detailed Markdown Context System for an AI Developer Agent to build a 100% secure, scalable backend framework based on my raw application ideas. Do not use placeholders, generic bullet points, or hand-waving shortcuts like "// TODO". Write out every single structure, data contract, and rule in complete detail. Analyze my app data and output the exact text contents for the following backend files: ### File 1: `.context/backend-prd.md` (Granular Functional Specifications) - Targeted Users & Roles: Break down system roles (e.g., Guest, Authenticated User, Organization Admin, System Super-Admin) and their precise capabilities. - Core Logical Features: Detail the background processes, cron jobs, third-party integrations (webhooks, email triggers, queues), and data processing loops down to the minor validation steps. - Strict Business Boundaries: List exactly what data transitions are illegal (e.g., "A user cannot change their organization_id after creation"). ### File 2: `.context/backend-architecture.md` (Folder Layout, DB Schemas & Tech Stack) - Definitively choose the best stack (e.g., Node.js/TypeScript with NestJS or Next.js Server Actions, PostgreSQL with Prisma, Redis for caching). - Complete Directory Blueprint: Map out a nested folder structure indicating exactly where Controllers, Services, Middleware, Repositories, Validations, and DTOs (Data Transfer Objects) live. - Hardcore DB Schema Specs: Write out the exact SQL/Prisma schema strings for every single table, including field types, foreign keys, constraints, indexes, and cascades. ### File 3: `.context/backend-security-rules.md` (The Ironclad Guardrails) - Rule-Based Restrictions: Explicitly command the AI to never bypass validation. All inputs must use a validation library (Zod/Joi). - Authentication & Authorization: Detail JWT/Session expiration handling, secure cookie configs (HttpOnly, Secure, SameSite), and RBAC (Role-Based Access Control) middleware logic. - API Protection Rules: Specify rate limiting thresholds (e.g., max 100 requests per 15 mins per IP), CORS configurations, input sanitization against SQL Injection/XSS, and a unified global error-handling wrapper contract. ### File 4: `.context/backend-routes.md` (Full Payload & API Contracts) - Map out every single API Route or Server Action endpoint. For EVERY single route without exception, write the exact structural schema for: 1. HTTP Method & Path (e.g., `POST /api/v1/auth/register`) 2. Request Body / Query Params (Full TypeScript interfaces with type assignments) 3. Response Status 200/201 Payload (The complete exact JSON output structure) 4. Response Error Status 400/401/403/500 Payloads (Exact JSON structure showing error keys and message formats) ### File 5: `.context/backend-phases.md` (Atomic Database & Logic Roadmap) - Break the backend building process into hyper-focused, sequential phases (e.g., Phase 1: DB Schema & Migration, Phase 2: Auth Logic & Encryption, Phase 3: Core CRUD Operations, Phase 4: Integrations & Webhooks). ### File 6: `.context/backend-memory.md` (Save State Entry Point) - Initialize the system memory file marking Phase 1 as active and defining what needs to be checked first. Output each file clearly wrapped inside its own markdown code fence block so I can save them immediately. Here is my raw data: [PASTE YOUR RAW IDEA, DATABASE VISIONS, AND APIS HERE]"
  },
    {
    id: 2,
    title: "The Deep Frontend Context Architect",
    description: "Part 1: The Master Context Architect Prompts - Prompt 2",
    prompt:"You are a Lead Frontend Engineer and Senior UI/UX Design System Director. Your objective is to generate an ultra-premium, hyper-detailed Frontend Markdown Context System for an AI Developer Agent. This system must translate raw user data and backend API contracts into a highly animated, deeply immersive interface (reminiscent of platforms like Duolingo or high-end premium web apps). Write out every single specification completely without placeholders. Analyze my data alongside the provided backend contracts, and output the exact text contents for the following frontend files: ### File 1: `.context/frontend-prd.md` (User Journeys & Features) - Targeted User Experience Goals: Define how users move through views, loading states, and state-restoration points. - Core Visual Features: Detail the exact micro-features (e.g., state-driven dynamic sidebars, contextual notifications, gamified reward screens). - Boundary Constraints: Define layout rule exceptions (e.g., `Login view has no navigation bar; Dashboard has sticky navigation`). ### File 2: `.context/frontend-design.md` (The Complete Design Token System) - Color Palette Specs: Define precise hex codes for Primary, Secondary, Background, Surface, Accents, Success, and Error states across both Light and Dark modes. - Typography & Layout: Detail font families, exact rem/pixel sizing scales, line-heights, letter-spacing, and standard padding/gap grids. - Element Rules: Detail custom styling guidelines for border-radii, 3D box-shadow depths, micro-gradients, and custom form input borders. ### File 3: `.context/frontend-uiux.md` (Component Interaction & Gamification Manual) - Break down the explicit UX behaviors for every UI primitive: - Form Fields: Focus color morphing, error state shakes, and smooth progressive step sliders. - Buttons: Magnetic pull effects, click scales (`scale: 0.95`), and text morphs to loading states. - Page Transitions: Skeleton screens matching exact components, fluid Framer Motion slide-fades. - Reward Mechanics: Detailed trigger rules for canvas-confetti, floating progress streak animations, and celebratory typography alerts upon micro-milestones. ### File 4: `.context/frontend-views-tree.md` (Component Topology & Context Routing) - Map out the exact UI component and page directory layout. For EVERY single route/view, explicitly declare: - Route path and layout inheritance rules. - Required client-side local/global state (e.g., Zustand slices vs. React `useState`). - Exactly how it consumes the data contracts from the backend. Explicitly write down the Prop Type Interfaces for every component wrapper. ### File 5: `.context/frontend-rules.md` (Strict Workspace Isolations) - Set absolute guardrails commanding the AI to never open or read raw backend code files. It must rely entirely on the markdown context specifications. Define folder paths and framework guidelines (e.g., Tailwind CSS, shadcn/ui components integration, next/image handling). ### File 6: `.context/frontend-phases.md` (Visual Assembly Roadmap) - Break the UI compilation into clean steps (e.g., Phase 1: Setup & Design Tokens, Phase 2: Shell Layout & Navigation, Phase 3: Form Interaction Components, Phase 4: State Hookup & API Connection). ### File 7: `.context/frontend-memory.md` (Initial Frontend State) Output each file clearly wrapped inside its own markdown code fence block. Here is my visual data and raw concept: [PASTE VISUAL IDEAS, DESIGN REFERENCES, AND ATTACH BACKEND-ROUTES.MD TEXT HERE]"
  },
       {
    id: 3,
    title: "The Backend Coding Session Prompt",
    description: "Part 2: The Execution Session Prompts (With Auto-Updates) - Prompt 1",
    prompt:"Initialize Deep Backend Developer Mode. We are implementing an isolated milestone in a clean context window. ### CRITICAL WORKSPACE BOUNDARIES: - DO NOT read, scan, or analyze raw code files across the directory tree. - Rely strictly on `.context/backend-routes.md` and `.context/backend-security-rules.md` as single sources of truth. ### EXECUTION INSTRUCTIONS: 1. Read `.context/backend-prd.md` and `.context/backend-architecture.md` to ground your understanding. 2. Check `.context/backend-memory.md` and `.context/backend-phases.md` to identify the current active task and where the previous session stopped. 3. Write clean, production-ready backend code following strict TypeScript signatures and validation rules. ### MANDATORY SIDE-BY-SIDE AUTO-UPDATE PROTOCOL: Before concluding your response or declaring a feature finished, you MUST output the complete, updated text for these two files: 1. `.context/backend-memory.md`: Document what was finished in this session, any active blockers, and the next immediate tasks. 2. `README.md` (The Master File & Feature Map): Update this file so future AI sessions can make pinpoint edits without scanning the codebase. You MUST maintain this exact structure inside README.md: # Backend Master Feature & File Directory ## 📍 Feature to File Mapping For every feature built, map its exact file locations: - **Feature Name:** [e.g., Email/Password Auth] - **Controller/Route Handler:** `@/app/api/auth/login/route.ts` - **Business Logic / Service:** `@/services/auth.service.ts` - **Data Validation / Schema:** `@/lib/validations/auth.schema.ts` - **Database Model / Migration:** `@/prisma/schema.prisma` (User Table) ## 🔌 Active API Routes Contract (For Frontend Integration) - `POST /api/v1/auth/login` - **Payload:** `{ email: string, password: string }` - **Success (200):** `{ success: true, token: string, user: {...} }` - **Errors:** `400 (Invalid Inputs)`, `401 (Unauthorized)` Analyze the active task in `backend-memory.md` right now. Tell me what backend file/feature we are creating or modifying first, and await my confirmation to generate code.  
  },
         {
    id: 4,
    title: "The Frontend Coding Session Prompt",
    description: "Part 2: The Execution Session Prompts (With Auto-Updates) - Prompt 2",
    prompt:"Initialize Premium Frontend Developer Mode. We are implementing an isolated visual milestone in a clean context window. ### CRITICAL WORKSPACE BOUNDARIES: - DO NOT scan the project directory or read raw code files. - Read the root `README.md` file to consume active backend API formats and feature locations. - Follow `.context/frontend-rules.md` for framework and styling constraints. ### EXECUTION INSTRUCTIONS: 1. Read `.context/frontend-design.md` and `.context/frontend-uiux.md` for visual tokens, animations, hover scales, and gamification feedback loops. 2. Check `.context/frontend-memory.md` and `.context/frontend-phases.md` to identify the active UI task. 3. Build components using modern layout practices, Framer Motion animations, custom skeletons, and responsive utilities. ### MANDATORY SIDE-BY-SIDE AUTO-UPDATE PROTOCOL: Before concluding your response or declaring a feature finished, you MUST output the complete, updated text for these two files: 1. `.context/frontend-memory.md`: Document finished components, active state hooks, and next immediate UI steps. 2. `README.md` (The Frontend Master Feature & Component Directory): Append/update the frontend section of `README.md` so future edits require zero directory scanning: # Frontend Master Component & View Directory ## 🎨 UI Feature & Component Mapping - **Page / Route:** `/dashboard/settings` (`@/app/dashboard/settings/page.tsx`) - **Layout Shell:** `@/components/layouts/DashboardLayout.tsx` - **Core Interactive Features:** - **Profile Form Component:** `@/components/features/settings/ProfileForm.tsx` - **Avatar Upload Modal:** `@/components/features/settings/AvatarModal.tsx` - **State Management Slice:** `@/store/useUserStore.ts` - **Animations & UX Trigger:** Uses `canvas-confetti` on profile update success. Analyze the current state in `frontend-memory.md` right now. Tell me what UI feature or component map we are executing first, and await my confirmation to write the code."
  },
 {
     id: 5,
    title: "The Master Idea Extractor & Detailer Prompt",
    description: "Idea md file",
    prompt:"     You are an Elite Product Manager, Startup Founder, and Systems Architect. I am going to give you my raw, incomplete, minimal application idea. Your job is to extract this idea, challenge any gaps in my logic, think through the hidden engineering complexities, and build a hyper-detailed, production-ready master `idea.md` file. To do this right, do not make wild assumptions. First, extract what I give you, expand it using industry best practices for high-retention software (like Duolingo-style UX and premium SaaS flows), and then organize it into the strict structure below. ### Please output the final result as a single, complete copy-pasteable file structured exactly like this: # Master Product Blueprint: [Insert App Name] ## 🎯 1. Core Mission & The `Hook` - **The Core Value Proposition:** What problem does this app solve in 1 sentence? - **The `Aha!` Moment:** What is the exact moment a new user experiences the true value of the app for the first time? - **Retention Strategy:** How do we keep users coming back daily/weekly? (Gamification, streaks, notification loops, or high-utility workflows). ## 👥 2. User Roles & Permission Matrices - Define every type of user that will log into this platform (e.g., Guest, Standard User, Workspace Creator, Super Admin) and exactly what boundaries separate them. ## 🛠️ 3. Complete Feature Breakdown (The Minor Details) For every feature I mentioned (and the hidden sub-features required to make them work), break them down into granular detail: - **Authentication & Onboarding:** (Don`t just say `login`. Detail social logins, email verification, and the progressive onboarding questions). - **Core Feature 1:** (Write out the input fields, processing logic, and expected outcomes). - **Core Feature 2:** (Detail data views, filtering capabilities, and interactive actions). - **Notification & Engagement Engine:** (System alerts, email triggers, or achievement popups). ## 🔄 4. The Complete Platform User Flow Map out the step-by-step psychological journey of a user from clicking `Sign Up` to regular daily use: - *Journey A (Onboarding):* Step 1 -> Step 2 -> Step 3. - *Journey B (Daily Active Use):* Landing on dashboard -> performing core action -> receiving feedback/reward. ## 🔒 5. Hidden Technical & Logic Complexities (What to Watch Out For) - What could break? What data requires strict validation? (e.g., `If an organization deletes its team lead, ownership must automatically transfer to the oldest member`). - List at least 5 strict business logic boundaries that the backend must enforce to prevent data corruption or exploitation. --- Here is my raw, minimal, and incomplete application idea, feature list, and references: [PASTE YOUR MESSY NOTES, SHORT BULLET POINTS, OR INCOMPLETE FLOWS HERE] "
 },
 {
     id: 6,
    title: "The Updated Phase 2 (New Chat Session) Prompt",
    description: "New Session",
    prompt:"Initialize New Execution Session for Phase 2. 🛑 STRICT SYSTEM CONSTRAINT - DO NOT READ CODEBASE FILES: - You are strictly FORBIDDEN from using file-search, code-globbing, or inspecting any existing `.ts`, `.tsx`, `.js`, or database migration files from Phase 1. - Treat the Phase 1 codebase as a locked, compiled black box. - You must rely 100% on the abstraction contracts and file mappings documented inside our markdown files. ### 📚 CONTEXT LOAD INSTRUCTIONS: Read the following markdown files from the `.context/` directory in order: 1. `@.context/prd.md` & `@.context/architecture.md` (System Foundations & Tech Stack) 2. `@.context/rules.md` (Coding standards, folder structures, & file path guidelines) 3. `@.context/ux-ui.md` or `@.context/backend-security-rules.md` (Design/Security constraints) 4. `@README.md` (To see the exact file paths and active endpoints created in Phase 1) 5. `@.context/phases.md` (To verify we are moving to Phase 2) 6. `@.context/memory.md` (To read the contract definitions of where Phase 1 left off) ### ✍️ MANDATORY SIDE-BY-SIDE AUTO-UPDATE PROTOCOL: As we build Phase 2, whenever you complete a feature, create a file, or build an endpoint/component, you MUST update `README.md` with deep, hyper-detailed specifications. Every entry in `README.md` must explicitly detail: - **Feature Name & Description:** What it does and its exact business logic. - **File Location Mapping:** The exact paths to its routes, UI components, state slices, services, or validations. - **Payload & Interface Contracts:** Full TypeScript interfaces for request/response payloads or component props. - **UX & State Triggers:** How it connects to animations, loading skeletons, error handlers, and neighboring features. ### 🎯 YOUR FIRST MANDATORY RESPONSE: Confirm that you have read ONLY the markdown files. List the following 3 items to prove you are aligned: 1. The active task for Phase 2 (from `phases.md`). 2. The specific file paths from `README.md` that Phase 2 will connect to. 3. The FIRST NEW file path we need to create/modify for Phase 2, along with how you plan to document it in `README.md`. Do NOT write code or touch the directory tree until I confirm your plan."
 },
];

const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const badgeEl = document.getElementById('badge');

const copyIconSVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg>`;
const checkIconSVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,8 7,12 13,4"/></svg>`;

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(list) {
  badgeEl.textContent = list.length + (list.length === 1 ? ' prompt' : ' prompts');
  grid.innerHTML = '';

  if (!list.length) {
    grid.innerHTML = '<div class="empty">No prompts match your search.</div>';
    return;
  }

  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span class="card-num">#${String(p.id).padStart(2,'0')}</span>
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-desc">${esc(p.description)}</div>
      </div>
      <div class="preview">${esc(p.prompt)}</div>
      <div class="card-foot">
        <span class="chars">${p.prompt.length.toLocaleString()} chars</span>
        <button class="btn-copy" data-id="${p.id}">${copyIconSVG} Copy prompt</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = PROMPTS.find(x => x.id === +btn.dataset.id);
      if (!p) return;
      navigator.clipboard.writeText(p.prompt).then(() => {
        btn.innerHTML = checkIconSVG + ' Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = copyIconSVG + ' Copy prompt';
          btn.classList.remove('copied');
        }, 2000);
      });
    });
  });
}

searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase().trim();
  if (!q) return render(PROMPTS);
  render(PROMPTS.filter(p =>
    p.title.toLowerCase().includes(q) ||
    p.description.toLowerCase().includes(q) ||
    p.prompt.toLowerCase().includes(q)
  ));
});

render(PROMPTS);
</script>
</body>
</html>
